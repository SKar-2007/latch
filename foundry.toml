[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["FeedGuard", "QuoterGuard", "FailSafeExecutor"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 64
depth = 48
fail_on_revert = false
show_metrics = true
call_override = false
