[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# Read everywhere, but write only to the parity fixture directory. The fixture is written solely by
# `forge script script/EmitAbiFixture.s.sol`, never by a test run.
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./client/test/fixtures" },
]
gas_reports = ["FeedGuard", "QuoterGuard", "FailSafeExecutor"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 64
depth = 48
fail_on_revert = false
show_metrics = true
call_override = false
