[profile.default]
src = "contracts"
# Uniswap's periphery is pinned at v3-periphery v1.0.0, whose `Quoter` is `solc =0.7.6`. Forge
# resolves that pragma to its own compiler, but 0.7.6 predates `cancun` and so cannot honour the
# `evm_version` above. It is compiled against `berlin` -- the newest EVM version 0.7.6 accepts --
# which is what Uniswap shipped against. Only `Quoter` is restricted; no other periphery file is
# reachable from LATCH's source, and the path pin stops one being dragged in silently later.
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
]
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# Read everywhere, but write only to the parity fixture directory. The fixture is written solely by
# `forge script script/EmitAbiFixture.s.sol`, never by a test run.
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./client/test/fixtures" },
]
gas_reports = ["FeedGuard", "QuoterGuard", "FailSafeExecutor"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 64
depth = 48
fail_on_revert = false
show_metrics = true
call_override = false
